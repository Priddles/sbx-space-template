# Docker sandbox environment file
# See https://docs.docker.com/ai/sandboxes/configuration/environment-files

schemaVersion: "1"
name: unnamed-sandbox
agent: kit-sbx-base

workspace:
  path: ${{ env.fileDir }}
  clone: false

args:
  gitconfig:
    default: $HOME/.config/git/config
    description: Host gitconfig to copy into the sandbox

env:
  # Disable Claude's online MCP connectors by default.
  ENABLE_CLAUDEAI_MCP_SERVERS: "false"

kits:
  # Shared base with devcontainer
  - .sbx/kit-sbx-base

  # Boyter
  - .sbx/kit-code-search

  # VS Code specific configuration
  - .sbx/kit-vscode

  # Claude
  - docker/sbx-kit-claude-mixin:latest
  - docker/sbx-kit-claude-sbx-statusline:latest
  - .sbx/kit-claude

lifecycle:
  postCreate:
    - name: Sync git config
      command: >-
        sbx cp "${{ env.args.gitconfig }}" "$SBX_SANDBOX_NAME:/home/agent/.config/git/config"
        && sbx exec -u root "$SBX_SANDBOX_NAME" chown agent:agent /home/agent/.config/git/config
