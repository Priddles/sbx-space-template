# syntax=docker/sandbox-kit:3
#
# Updates Claude Code and configures it for this workspace, merging our settings over the ones
# seeded by the Claude kits. List it after those kits in sbxenv.yaml, so its install hooks run last.

schemaVersion: "3"
kind: mixin
displayName: Claude

requires: ["claude", "deb/jq"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: claude update
          user: agent
          description: Update Claude Code to latest
        - command: |
            set -e
            f=/home/agent/.claude/settings.json
            [ -f "$f" ] || echo '{}' > "$f"
            tmp=$(mktemp -p /home/agent/.claude)
            jq '.permissions.defaultMode = "bypassPermissions"
                | .skipDangerousModePermissionPrompt = true' "$f" > "$tmp"
            mv "$tmp" "$f"
          user: agent
          description: Default Claude Code to bypass permissions without the warning dialog
        # Registers the servers from .sbx/kit-code-search; cs and scc come from the base image.
        - command: |
            set -e
            add() {
              claude mcp get "$1" >/dev/null 2>&1 || claude mcp add --scope user "$@"
            }
            add searchcode --transport http https://api.searchcode.com/v1/mcp
            add cs -- cs --mcp
            add scc -- scc --mcp
          user: agent
          description: Register the searchcode, cs and scc MCP servers with Claude Code
