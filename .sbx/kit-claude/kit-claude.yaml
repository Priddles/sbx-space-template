# syntax=docker/sandbox-kit:3
#
# Updates Claude Code and configures it for this workspace, merging our settings over the ones
# seeded by the Claude kits. List it after those kits in sbxenv.yaml, so its install hooks run last.

schemaVersion: "3"
kind: mixin
displayName: Claude

requires: ["claude", "deb/jq"]

capabilities:
  # Ensure npm registry is open while the install hooks run to fetch the Chrome DevTools MCP server.
  - type: com.docker.sandbox/network-policy@2
    config:
      install:
        allow:
          - hosts: [registry.npmjs.org:443]
            methods: [GET, HEAD]

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: claude update
          user: agent
          description: Update Claude Code to latest

        - command: |
            set -e
            f=/home/agent/.claude/settings.json
            [ -f "$f" ] || echo '{}' > "$f"
            tmp=$(mktemp -p /home/agent/.claude)
            jq '.permissions.defaultMode = "bypassPermissions"
                | .skipDangerousModePermissionPrompt = true' "$f" > "$tmp"
            mv "$tmp" "$f"
          user: agent
          description: Default Claude Code to bypass permissions without the warning dialog

        # Registers the servers from .sbx/kit-code-search; cs and scc come from the base image.
        - command: |
            set -e
            add() {
              claude mcp get "$1" >/dev/null 2>&1 || claude mcp add --scope user "$@"
            }
            add searchcode --transport http https://api.searchcode.com/v1/mcp
            add cs -- cs --mcp
            add scc -- scc --mcp
          user: agent
          description: Register the searchcode, cs and scc MCP servers with Claude Code

        - command:
            - bash
            - -c
            - set -e; . "$HOME/.nvm/nvm.sh"; npm install -g --ignore-scripts chrome-devtools-mcp@latest
          user: agent
          description: Install the Chrome DevTools MCP server

        # Drives the base image's Chromium.
        # --no-sandbox because Chromium's sandbox cannot start inside the container.
        - command: |
            set -e
            claude mcp get chrome-devtools >/dev/null 2>&1 || claude mcp add --scope user chrome-devtools \
              --env CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS=1 -- \
              bash -c '. "$HOME/.nvm/nvm.sh" && exec chrome-devtools-mcp --executablePath=/usr/bin/chromium --headless --isolated --chromeArg=--no-sandbox'
          user: agent
          description: Register the Chrome DevTools MCP server with Claude Code
