# syntax=docker/sandbox-kit:3
#
# Base for the Docker sandbox
#
# See:
#   - https://docs.docker.com/ai/sandboxes/customize/author/build-an-agent
#   - https://docs.docker.com/ai/sandboxes/customize/author/capabilities
#   - https://github.com/docker/sbx-kits-contrib/blob/v3/claude-mixin/claude-mixin.yaml

schemaVersion: "3"
kind: workload
displayName: Sandbox Base

args:
  # Although the sbx capability checks any username for conformance, most kits (including official
  # Docker ones) hardcode the username as `agent`.
  username:
    default: "agent"
    pattern: "^agent$"
    buildArg: USERNAME

capabilities:
  - type: com.docker.sandbox/sbx@1

  # Egress is deny-by-default and entries are as narrow as the workflow allows. Git mutations go
  # over SSH; everything over HTTP is read-only.
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          # Debian
          - hosts: [deb.debian.org:80]
            methods: [GET, HEAD]
          # Docker, including Docker Hardened Images
          - hosts:
              - auth.docker.io:443
              - dhi.io:443
              - docs.docker.io:443
              - production.cloudfront.docker.com:443
              - registry-1.docker.io:443
            methods: [GET, HEAD]
          # GitHub: SSH for git, read-only HTTP for https clones, raw files and container images
          - github.com:22
          - hosts:
              - ghcr.io:443
              - github.com:443
              - raw.githubusercontent.com:443
            methods: [GET, HEAD]

  - type: com.docker.sandbox/ssh-agent@1
    optional: false
    config:
      phase: [runtime]
      unrestricted: false
      authenticate: [git@github.com]
